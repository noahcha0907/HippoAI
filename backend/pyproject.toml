[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kirby-backend"
version = "0.1.0"
description = "Reproducible EEG shortcut audits and archived MedQA experiments for Kirby"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
eeg = [
  "torch>=2.6,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "moabb>=1.2,<2",
  "mne>=1.7,<2",
  "openai>=2,<3",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.9,<4",
]
astra = ["openai>=2,<3"]
# Compatibility bounds, NOT a GPU-validated lock. Record and pin the working
# environment after the first real checkpoint calibration.
gpu = [
  "torch>=2.6,<3",
  "transformers>=4.50,<5",
  "accelerate>=1,<2",
  "huggingface-hub>=0.30,<1",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "Pillow>=11,<13",
  "Jinja2>=3.1,<4",
]

[project.scripts]
kirby = "kirby.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kirby*"]
